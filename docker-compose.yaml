services:
  app:
    build:
      context: .
      args:
        TZ: ${TZ}
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
    secrets:
      - db_password

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE}
